<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: you are inside the visor — calm, deep, alive
   IDEA: a helmet lens: holograms float at different depths in front of you, the world streams behind
   PICTURE: a live SOL price hanging in mid-air inside three tilted orbit rings, panels on a curved arc
   COLOUR and TYPE: void black, ice-cyan light, ultraviolet edges, a warm gold signal; Inter 200 numerals
   LAYOUT: lens frame → depth field canvas → 3D stage (hologram core, curved panels, tilted chart) → command chips */
:root{color-scheme:dark;--ink:#eaf6ff;--mute:rgba(200,230,255,.55);--cy:#7ef2ff;--vi:#b18cff;--gold:#ffcf7a;--up:#6dffb0;--dn:#ff7a8c}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
canvas#space{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.lens{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,8,20,.55) 78%,rgba(0,0,0,.92) 100%),
             conic-gradient(from 210deg at 50% 50%,transparent 0 40deg,rgba(126,242,255,.07) 55deg,transparent 80deg 300deg,rgba(177,140,255,.06) 320deg,transparent 340deg)}
.lens::before{content:"";position:absolute;inset:3%;border-radius:46% 46% 40% 40%/38% 38% 30% 30%;box-shadow:inset 0 0 0 1px rgba(126,242,255,.12),inset 0 0 80px rgba(126,242,255,.06)}
.lens::after{content:"";position:absolute;left:8%;top:6%;width:38%;height:18%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.07),transparent);transform:rotate(-14deg)}
.reticle{position:fixed;left:50%;top:30%;width:240px;height:240px;margin:-120px 0 0 -120px;z-index:2;pointer-events:none;opacity:.35}
.stage{position:relative;z-index:2;min-height:100vh;perspective:1100px;perspective-origin:50% 30%;padding:18px 16px 130px;overflow-x:clip}
.world{transform-style:preserve-3d;width:100%;transition:transform .25s ease-out;max-width:760px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;transform:translateZ(40px)}
.brand{font:200 22px/1 Inter,sans-serif;letter-spacing:.6em;color:var(--cy);text-shadow:0 0 18px rgba(126,242,255,.6)}
.clock{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
#headline{margin:10px 0 0;text-align:center;font:300 16px/1.35 Inter,sans-serif;color:var(--ink);text-shadow:0 0 12px rgba(126,242,255,.35);transform:translateZ(60px)}
.core{position:relative;height:280px;transform-style:preserve-3d;transform:translateZ(60px)}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(126,242,255,.55);box-shadow:0 0 24px rgba(126,242,255,.25),inset 0 0 24px rgba(126,242,255,.15)}
.r1{width:250px;height:250px;margin:-125px 0 0 -125px;transform:rotateX(72deg)}
.r2{width:210px;height:210px;margin:-105px 0 0 -105px;transform:rotateX(72deg) rotateY(28deg);border-color:rgba(177,140,255,.6)}
.r3{width:170px;height:170px;margin:-85px 0 0 -85px;transform:rotateY(70deg);border-color:rgba(126,242,255,.35)}
.price{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.price .sym{font-size:12px;letter-spacing:.4em;color:var(--mute)}
.price .p{font:200 clamp(52px,15vw,84px)/1 Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  text-shadow:-1.5px 0 rgba(255,60,120,.45),1.5px 0 rgba(60,220,255,.55),0 0 30px rgba(126,242,255,.45);transition:color .5s}
.price .c{font-size:14px;margin-top:6px}
.sig{margin-top:10px;padding:4px 12px;border-radius:999px;font-size:12px;letter-spacing:.12em;border:1px solid currentColor}
.arc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;transform-style:preserve-3d;margin-top:4px}
.holo{position:relative;padding:12px 14px;border-radius:18px;background:linear-gradient(160deg,rgba(126,242,255,.09),rgba(177,140,255,.05) 60%,rgba(0,0,0,.15));
  border:1px solid rgba(126,242,255,.22);box-shadow:0 0 30px rgba(126,242,255,.08),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.holo::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(126,242,255,.035) 0 1px,transparent 1px 4px)}
@media(min-width:601px){.arc .holo:nth-child(1){transform:rotateY(14deg)}.arc .holo:nth-child(3){transform:rotateY(-14deg)}}
.read{margin-top:10px;padding:16px;text-align:center}
.bias{font:200 46px/1 Inter,sans-serif;letter-spacing:.08em;margin:6px 0}
.stats{font-size:12px;color:var(--mute);line-height:1.5}
.lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.v{font:300 22px/1.15 Inter,sans-serif;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.d{font-size:12px;color:var(--mute);margin-top:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.gold{color:var(--gold)}
.floor{margin-top:14px;transform:rotateX(10deg);transform-origin:50% 0}
.fig{position:relative;height:190px}.fig svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(126,242,255,.5))}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mute);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 12px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75))}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(126,242,255,.35);background:rgba(126,242,255,.08);color:var(--ink);font:400 14px Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 18px rgba(126,242,255,.15)}
.chip.warn{border-color:rgba(255,122,140,.5);background:rgba(255,122,140,.08)}
.chip:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.ask{display:none;gap:8px;margin-top:14px}
textarea{flex:1;min-height:46px;resize:none;background:rgba(126,242,255,.06);border:1px solid rgba(126,242,255,.3);border-radius:16px;color:var(--ink);font:16px/1.4 Inter,sans-serif;padding:11px}
.go{flex:none;min-height:46px;border:0;border-radius:16px;padding:0 18px;background:linear-gradient(135deg,var(--cy),var(--vi));color:#031018;font:600 14px Inter,sans-serif;cursor:pointer}
.answer{display:none;margin-top:12px;padding:14px 16px;font:300 16px/1.45 Inter,sans-serif;text-shadow:0 0 12px rgba(126,242,255,.35)}
.log{margin-top:12px;font-size:11px;color:var(--mute);max-height:48px;overflow:hidden;text-align:center}
.modal{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal .holo{max-width:340px;padding:20px}
.modal .row{display:flex;gap:10px;margin-top:14px}
.modal button{flex:1;min-height:44px;border-radius:14px;border:1px solid rgba(126,242,255,.3);background:transparent;color:var(--ink);font:500 15px Inter,sans-serif;cursor:pointer}
.modal .yes{border-color:rgba(255,122,140,.6);background:rgba(255,122,140,.18)}
@media(max-width:600px){.arc{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px}.holo{padding:10px}.v{font-size:16px}.d{font-size:11px}.core{height:260px}.r1{width:220px;height:220px;margin:-110px 0 0 -110px}}
@media(prefers-reduced-motion:no-preference){.r1{animation:spinA 18s linear infinite}.r2{animation:spinB 12s linear infinite}.r3{animation:spinC 22s linear infinite}
  @keyframes spinA{to{transform:rotateX(72deg) rotateZ(360deg)}}@keyframes spinB{to{transform:rotateX(72deg) rotateY(28deg) rotateZ(-360deg)}}@keyframes spinC{to{transform:rotateY(70deg) rotateX(360deg)}}
  .holo{animation:float 7s ease-in-out infinite}.arc .holo:nth-child(2){animation-delay:-2s}.arc .holo:nth-child(3){animation-delay:-4s}
  @keyframes float{50%{translate:0 -5px}}}
.flash-up{color:var(--up)!important}.flash-dn{color:var(--dn)!important}
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<svg class="reticle" viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="116" fill="none" stroke="#7ef2ff" stroke-width=".6" stroke-dasharray="2 6"/><path d="M120 0v18M120 222v18M0 120h18M222 120h18" stroke="#7ef2ff" stroke-width=".8"/></svg>
<div class="stage" id="stage"><div class="world" id="world">
  <div class="top"><div class="brand">JARVIS</div><div class="clock" id="clock"></div></div>
  <p id="headline">Waking up, sir…</p>

  <div class="core" aria-live="polite">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="price"><div class="sym">SOL · BINANCE FUTURES</div><div class="p" id="pSOL">—</div><div class="c" id="cSOL">&nbsp;</div><div class="sig" id="sig">—</div></div>
  </div>

  <div class="holo read" aria-live="polite"><div class="lbl">Candle read · SOL 1-minute · Binance</div>
    <div class="bias" id="bias">—</div><div class="d" id="biasWhy">waiting for candles…</div><div class="stats" id="biasStats"></div></div>

  <div class="arc">
    <div class="holo"><div class="lbl">Bitcoin</div><div class="v" id="pBTC">—</div><div class="d" id="cBTC">&nbsp;</div></div>
    <div class="holo"><div class="lbl">FTMO bot</div><div class="v" id="botS">—</div><div class="d" id="botD">—</div></div>
    <div class="holo"><div class="lbl">Ethereum</div><div class="v" id="pETH">—</div><div class="d" id="cETH">&nbsp;</div></div>
  </div>

  <div class="holo floor"><div class="legend"><span><i style="background:#eaf6ff"></i>SOL daily</span><span><i style="background:#ffcf7a"></i>10-day</span><span><i style="background:#7ef2ff"></i>50-day</span></div>
    <div class="fig" id="fig"><svg id="chart" aria-label="Solana daily closes with 10 and 50 day averages"></svg></div>
    <div class="d" id="solD">—</div></div>

  <div class="ask" id="askRow"><textarea id="q" placeholder="Talk to me, sir"></textarea><button class="go" id="go" type="button">Send</button></div>
  <div class="holo answer" id="ans" aria-live="polite"></div>
  <div class="log" id="log" aria-live="polite"></div>
</div></div>
<div class="lens" aria-hidden="true"></div>
<div class="dock">
  <button class="chip" id="kScan" type="button">Scan</button>
  <button class="chip" id="kBrief" type="button">Briefing</button>
  <button class="chip" id="kAsk" type="button">Ask</button>
  <a class="chip" href="https://claude.ai/artifact/7JrRcsxjKEmWkccgXJuVcn">Feed</a>
  <button class="chip warn" id="kReboot" type="button">Reboot</button>
</div>
<div class="modal" id="modal"><div class="holo"><div style="font-size:17px;font-weight:500">Reboot the trading bot?</div>
  <p class="d">Restarts and reloads its settings. Only with no open positions, outside 17:00–23:00.</p>
  <div class="row"><button type="button" id="mNo">Cancel</button><button type="button" class="yes" id="mYes">Reboot</button></div></div></div>
<script>
{
const $ = id => document.getElementById(id);
const fmt = (v,d=0) => Number(v).toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:d});
const SSM = (ps, comment) => "ps = r'''" + ps + "'''\n" + String.raw`cmd = await call_boto3(service_name="ssm", operation_name="SendCommand", region_name="il-central-1",
    params={"InstanceIds": ["i-0386e781ed9957a89"], "DocumentName": "AWS-RunPowerShellScript",
            "Comment": "` + comment + String.raw`", "Parameters": {"commands": [ps]}, "TimeoutSeconds": 150})
cid = cmd["Command"]["CommandId"]
res = None
for _ in range(120):
    await asyncio.sleep(1)
    try:
        res = await call_boto3(service_name="ssm", operation_name="GetCommandInvocation", region_name="il-central-1",
                               params={"CommandId": cid, "InstanceId": "i-0386e781ed9957a89"})
        if res["Status"] not in ("Pending", "InProgress", "Delayed"):
            break
    except ClientError:
        pass
result = {"out": (res or {}).get("StandardOutputContent", "")}
result`;
const TLS = String.raw`
$ErrorActionPreference="SilentlyContinue"
[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
`;
const PRICE_PS = TLS + String.raw`
foreach($s in "SOLUSDT","BTCUSDT","ETHUSDT"){ $t=Invoke-RestMethod "https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=$s"; "P|$s|$($t.lastPrice)|$($t.priceChangePercent)" }
$m=Invoke-RestMethod "https://fapi.binance.com/fapi/v1/klines?symbol=SOLUSDT&interval=1m&limit=500"
"M|" + (($m | %{ "$($_[0]);$($_[1]);$($_[4])" }) -join ",")
"OK|"
`;
const FULL_PS = PRICE_PS + String.raw`
$k=Invoke-RestMethod "https://fapi.binance.com/fapi/v1/klines?symbol=SOLUSDT&interval=1d&limit=90"
"K|" + (($k | %{ $_[4] }) -join ",")
$ft="C:\Users\FTMODemo\FTMO"
"RUN|" + [bool](Get-CimInstance Win32_Process -Filter "Name='terminal64.exe'" | ?{ $_.CommandLine -like '*\FTMO\terminal64.exe*ftmo-trading.ini*' })
Get-ChildItem "$ft\MQL5\Logs\2*.log" | sort Name | select -Last 3 | %{ Get-Content $_.FullName } | ?{ $_ -match 'US100TripleEA' -and $_ -match '\] (BUY|SELL)|closed:|CHK|ready|failed|skipped' } | select -Last 40 | %{ "L|" + ($_ -split [char]9)[2] + "|" + ($_ -split [char]9)[4] }
`;
const REBOOT_PS = String.raw`
Start-ScheduledTask FTMOStartTrading
Start-Sleep 75
"RUN|" + [bool](Get-CimInstance Win32_Process -Filter "Name='terminal64.exe'" | ?{ $_.CommandLine -like '*\FTMO\terminal64.exe*ftmo-trading.ini*' })
`;
let mcp = null, sample = null; const st = {prices:{}, sol:null, bot:null};
function log(t){ const d = document.createElement("div"); d.textContent = new Date().toLocaleTimeString("en-GB",{timeZone:"Asia/Jerusalem"}) + " · " + t; $("log").prepend(d); while ($("log").children.length > 3) $("log").lastChild.remove(); }
function dig(o, test){ if (o == null) return null;
  if (typeof o === "string"){ try { return dig(JSON.parse(o), test); } catch(e){ return test(o) ? o : null; } }
  if (test(o)) return o; if (typeof o === "object") for (const k of Object.keys(o)){ const r = dig(o[k], test); if (r != null) return r; } return null; }
async function runPS(ps, comment){ const r = await mcp.callTool("AWS MCP", "aws___run_script", {code: SSM(ps, comment)}); const p = r && r.payload !== undefined ? r.payload : r;
  return dig(p, x => typeof x === "string" && (x.includes("OK|") || x.includes("RUN|"))) || ""; }
function orb(state){ const c = state === "bad" ? "rgba(255,122,140,.7)" : state === "warn" ? "rgba(255,207,122,.65)" : "rgba(126,242,255,.55)"; document.querySelectorAll(".ring").forEach((r,i) => { if (i !== 1) r.style.borderColor = c; }); }

function applyPrices(out){
  applyCandles(out);
  for (const l of out.split(/\r?\n/)){ const m = l.match(/^P\|(\w+)USDT\|([\d.]+)\|(-?[\d.]+)/); if (!m) continue;
    const sym = m[1], p = +m[2], ch = +m[3], el = $("p"+sym), prev = st.prices[sym];
    if (!el) continue;
    el.textContent = (sym === "SOL" ? "" : "$") + fmt(p, sym === "SOL" ? 2 : sym === "ETH" ? 2 : 0);
    if (prev != null && p !== prev){ el.classList.remove("flash-up","flash-dn"); void el.offsetWidth; el.classList.add(p > prev ? "flash-up" : "flash-dn"); setTimeout(() => el.classList.remove("flash-up","flash-dn"), 1200); }
    const c = $("c"+sym); c.textContent = (ch>0?"+":"") + ch.toFixed(2) + "% 24h"; c.className = (sym === "SOL" ? "c " : "d ") + (ch < 0 ? "dn" : "up");
    st.prices[sym] = p; }
}
function applyCandles(out){
  const ml = out.split(/\r?\n/).find(l => l.startsWith("M|")); if (!ml) return;
  const K = ml.slice(2).split(",").map(x => x.split(";").map(Number)).filter(x => x.length === 3 && x[2] > 0);
  const done = K.slice(0, -1); if (done.length < 60) return;   // last candle is still forming
  const o = done.map(x => x[1]), c = done.map(x => x[2]);
  const bias = i => { if (i < 19) return 0; const avg = c.slice(i-19, i+1).reduce((a,b)=>a+b,0)/20; const dir = c[i] > o[i] ? 1 : c[i] < o[i] ? -1 : 0, tr = c[i] > avg ? 1 : -1; return dir && dir === tr ? dir : 0; };
  let n = 0, hit = 0, sum = 0;
  for (let i = 19; i < c.length - 1; i++){ const b = bias(i); if (!b) continue; const mv = c[i+1]/c[i]-1; n++; if (Math.sign(mv) === b) hit++; sum += b*mv; }
  const L = c.length - 1, b = bias(L), t = new Date(done[L][0] + 60000).toLocaleTimeString("en-GB",{timeZone:"Asia/Jerusalem",hour:"2-digit",minute:"2-digit"});
  $("bias").textContent = b > 0 ? "LONG" : b < 0 ? "SHORT" : "NEUTRAL"; $("bias").className = "bias " + (b > 0 ? "up" : b < 0 ? "dn" : "gold");
  $("biasWhy").textContent = "Candle closed " + t + (c[L] >= o[L] ? " green" : " red") + ", price " + (b ? (b > 0 ? "above" : "below") : "vs") + " its 20-minute average";
  if (n) $("biasStats").textContent = "Same rule, last " + n + " signals: right " + Math.round(hit/n*100) + "% · average next-minute move " + (sum/n*100 >= 0 ? "+" : "") + (sum/n*100).toFixed(3) + "% vs ~0.10% Binance round-trip fees. Rule output, not advice — tested candle rules showed no edge.";
}
function applyFull(out){
  applyPrices(out);
  const k = out.split(/\r?\n/).find(l => l.startsWith("K|"));
  if (k){ const closes = k.slice(2).split(",").map(Number).filter(v => v > 0);
    const done = closes.slice(0, -1);  // completed daily closes
    const ma = (arr, n) => arr.map((_,i) => i+1 >= n ? arr.slice(i+1-n, i+1).reduce((a,b)=>a+b,0)/n : null);
    const s10 = ma(done, 10), s50 = ma(done, 50), L = done.length-1;
    let cross = null; for (let i = L; i > 0; i--){ if (s10[i]!=null && s50[i]!=null && s10[i-1]!=null && s50[i-1]!=null && (s10[i]>s50[i]) !== (s10[i-1]>s50[i-1])){ cross = {i, up: s10[i]>s50[i], price: done[i], ago: L-i}; break; } }
    st.sol = {closes: done, s10, s50, up: s10[L] > s50[L], a10: s10[L], a50: s50[L], cross}; }
  const lines = out.split(/\r?\n/);
  if (lines.some(l => l.startsWith("RUN|"))){
    let open = {}, chk = ""; const MAG = {"20261125":"TOM","20261126":"DIP","20261127":"BTM"};
    for (const l of lines.filter(l => l.startsWith("L|"))){ const [, t, ...mm] = l.split("|"), m0 = mm.join("|"); let m;
      if (/ready:/.test(m0)) open = {};
      if ((m = m0.match(/^\[(TOM|DIP|BTM)[^\]]*\] (BUY|SELL)/))) open[m[1]] = m[2];
      if ((m = m0.match(/^\[(\d+)\] closed/))) delete open[MAG[m[1]]];
      if (/\[CHK/.test(m0)){ const hh = +t.slice(0,2); chk = String((hh+2)%24).padStart(2,"0") + ":" + t.slice(3,5) + " " + m0.replace(/ c=.*/, "").replace(/\[CHK (\w+)\]/, "$1"); } }
    st.bot = {running: lines.some(l => /^RUN\|True/i.test(l)), open, chk}; }
  render();
}
function drawChart(){
  const s = st.sol, svg = $("chart"); if (!s) return;
  const W = svg.clientWidth, H = svg.clientHeight, pad = 6, n = s.closes.length;
  const all = s.closes.concat(s.s10.filter(v=>v!=null), s.s50.filter(v=>v!=null)); const lo = Math.min(...all), hi = Math.max(...all);
  const X = i => pad + i*(W-2*pad)/(n-1), Y = v => H-pad-(v-lo)/(hi-lo||1)*(H-2*pad);
  const path = arr => arr.map((v,i) => v==null ? "" : (arr[i-1]==null ? "M" : "L") + X(i).toFixed(1) + "," + Y(v).toFixed(1)).join("");
  const area = "M" + X(0) + "," + H + s.closes.map((v,i) => "L" + X(i).toFixed(1) + "," + Y(v).toFixed(1)).join("") + "L" + X(n-1) + "," + H + "Z";
  let mark = ""; if (s.cross){ const i = s.cross.i; mark = '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(s.closes[i]).toFixed(1)+'" r="5" fill="'+(s.cross.up?"#5cf0a0":"#ff6b7d")+'" stroke="#03050b" stroke-width="2"/>'; }
  svg.innerHTML = '<defs><linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fe3ff" stop-opacity=".22"/><stop offset="1" stop-color="#6fe3ff" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#fa)"/><path d="'+path(s.closes)+'" fill="none" stroke="#f2f6ff" stroke-width="1.5" opacity=".9"/><path d="'+path(s.s10)+'" fill="none" stroke="#ffc46b" stroke-width="2"/><path d="'+path(s.s50)+'" fill="none" stroke="#6fe3ff" stroke-width="2"/>' + mark;
}
const chartObserver = new ResizeObserver(drawChart); chartObserver.observe($("fig"));
function render(){
  const s = st.sol, b = st.bot;
  if (s){ $("sig").textContent = s.up ? "ENTRY ACTIVE" : "NO ENTRY"; $("sig").className = "sig " + (s.up ? "up" : "gold");
    $("solD").textContent = "10-day " + fmt(s.a10,2) + (s.up ? " above " : " below ") + "50-day " + fmt(s.a50,2) + (s.cross ? " · last " + (s.cross.up ? "entry" : "exit") + " " + s.cross.ago + " days ago at $" + fmt(s.cross.price,2) : ""); drawChart(); }
  if (b){ $("botS").textContent = b.running ? "Online" : "Offline"; $("botS").className = "v " + (b.running ? "up" : "dn");
    const op = Object.entries(b.open).map(([k,v]) => k + " " + v.toLowerCase()); $("botD").textContent = op.length ? "Holding " + op.join(", ") : "Flat" + (b.chk ? " · " + b.chk.slice(0,5) : ""); }
  let head = "All quiet, sir.";
  if (b && !b.running) head = "The trading bot is offline, sir.";
  else if (b && Object.keys(b.open).length) head = "The bot is holding " + Object.keys(b.open).join(" and ") + ", sir.";
  else if (s && s.up) head = "Solana is trending up — entry signal active, sir.";
  else if (s) head = "Bot flat. Solana has no entry, sir.";
  $("headline").textContent = head; orb(b && !b.running ? "bad" : s && !s.up ? "warn" : "ok");
}
let pricing = false;
async function tickPrices(){ if (pricing || document.hidden) return; pricing = true;
  try { applyPrices(await runPS(PRICE_PS, "read-only: jarvis live prices")); } catch(e){ if (/auth/i.test(String(e && (e.code||e.message)))) log("AWS needs re-login: Settings › Connectors."); }
  pricing = false; }
let scanning = false, lastScan = 0;
async function scan(){ if (scanning || Date.now() - lastScan < 20000) return; scanning = true; lastScan = Date.now(); log("Full scan…");
  try { applyFull(await runPS(FULL_PS, "read-only: jarvis full scan")); log("Scan complete."); }
  catch(e){ log(/auth/i.test(String(e && (e.code||e.message))) ? "AWS needs re-login: Settings › Connectors." : "Scan failed: " + (e && (e.code||e.message) || "")); }
  scanning = false; }
async function ask(text){
  if (!text.trim()) return; if (!sample){ log("Ask is unavailable in this view."); return; }
  $("ans").style.display = "block"; $("ans").textContent = "One moment, sir…";
  const SYS = "You are JARVIS. English, calm, precise, dry British wit, call the user 'sir'. Maximum 2 sentences, under 25 words. Never recommend buying or selling; state, risk, invalidation only. Use the tools. Prices are Binance USDT-M futures. Solana: report the 10/50-day trend state and the 1-minute candle-rule reading with its measured hit rate; never phrase it as your recommendation.";
  const tools = [{name:"live_prices", description:"Latest Binance futures prices for SOL, BTC, ETH.", execute: async () => st.prices},
                 {name:"sol_signal", description:"Solana 10/50-day average entry/exit state and last cross.", execute: async () => st.sol ? {entryActive:st.sol.up, avg10:st.sol.a10, avg50:st.sol.a50, lastCross:st.sol.cross && {type:st.sol.cross.up?"entry":"exit", daysAgo:st.sol.cross.ago, price:st.sol.cross.price}} : {error:"not loaded"}},
                 {name:"candle_read", description:"Latest SOL 1-minute candle-rule reading (LONG/SHORT/NEUTRAL) and its measured hit rate.", execute: async () => ({reading:$("bias").textContent, why:$("biasWhy").textContent, stats:$("biasStats").textContent})},
                 {name:"bot_status", description:"FTMO trading bot: running, open positions, last check (Israel time).", execute: async () => st.bot || {error:"not loaded"}}];
  try { const r = await sample([{role:"user", content: SYS + "\n\nUser: " + text}], {tools, cache:false, onText: ({text}) => { $("ans").textContent = text; }}); $("ans").textContent = r.text; }
  catch(e){ $("ans").textContent = e && e.code === "rate_limited" ? "A moment, sir — rate limited." : "That failed, sir."; }
}
$("kScan").addEventListener("click", scan);
$("kBrief").addEventListener("click", () => ask("One-line situation report: Solana price and signal, bot status."));
$("kAsk").addEventListener("click", () => { $("askRow").style.display = "flex"; $("q").focus(); });
$("go").addEventListener("click", () => ask($("q").value));
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask($("q").value); } });
$("kReboot").addEventListener("click", async () => {
  log("Checking positions before reboot…"); await scan();
  if (!st.bot){ log("Cannot verify positions — reboot blocked."); return; }
  const hr = Number(new Date().toLocaleString("en-GB",{timeZone:"Asia/Jerusalem",hour:"2-digit",hour12:false}));
  if (Object.keys(st.bot.open).length){ log("Reboot refused: positions are open."); return; }
  if (hr >= 17 && hr < 23){ log("Reboot refused during 17:00–23:00."); return; }
  $("modal").style.display = "flex"; });
$("mNo").addEventListener("click", () => { $("modal").style.display = "none"; log("Reboot cancelled."); });
$("mYes").addEventListener("click", async () => { $("modal").style.display = "none"; $("kReboot").disabled = true; log("Rebooting… (~90 s)");
  try { const out = await runPS(REBOOT_PS, "jarvis: user-confirmed reboot of trading terminal"); log(/RUN\|True/i.test(out) ? "Bot back online." : "Result unclear — check the feed."); }
  catch(e){ log("Reboot failed."); } $("kReboot").disabled = false; scan(); });

// depth field: particles streaming toward the lens
const cv = $("space"), cx = cv.getContext("2d"); let SW = 0, SH = 0; const P = [];
function size(){ SW = cv.width = innerWidth * devicePixelRatio; SH = cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
for (let i = 0; i < 260; i++) P.push({x:(Math.random()-.5)*2, y:(Math.random()-.5)*2, z:Math.random()});
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches; let tx = 0, ty = 0, cxp = 0, cyp = 0;
function frame(t){
  cx.fillStyle = "rgba(0,2,8,.35)"; cx.fillRect(0,0,SW,SH);
  const f = Math.min(SW,SH)*.9;
  for (const p of P){ if (!calm) p.z -= .0016; if (p.z <= .02){ p.z = 1; p.x = (Math.random()-.5)*2; p.y = (Math.random()-.5)*2; }
    const sx = SW/2 + (p.x + cxp*.15) * f / p.z * .5, sy = SH*.38 + (p.y + cyp*.15) * f / p.z * .5;
    if (sx < 0 || sx > SW || sy < 0 || sy > SH) continue;
    const a = Math.min(1, (1-p.z)*1.3), r = (1-p.z)*2.2*devicePixelRatio + .3;
    cx.fillStyle = p.z > .5 ? "rgba(126,242,255," + a*.6 + ")" : "rgba(220,240,255," + a + ")"; cx.beginPath(); cx.arc(sx, sy, r, 0, 6.283); cx.fill(); }
  // parallax: pointer target + gentle sway
  const sw = calm ? 0 : Math.sin(t/4200)*.35;
  cxp += ((tx || sw) - cxp)*.06; cyp += ((ty || Math.cos(t/5300)*.25*(calm?0:1)) - cyp)*.06;
  $("world").style.transform = "rotateY(" + (cxp*3).toFixed(2) + "deg) rotateX(" + (-cyp*2.5).toFixed(2) + "deg)";
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener("pointermove", e => { tx = (e.clientX/innerWidth - .5)*2; ty = (e.clientY/innerHeight - .5)*2; });
addEventListener("pointerleave", () => { tx = ty = 0; });
addEventListener("touchend", () => { setTimeout(() => { tx = ty = 0; }, 1500); });
setInterval(() => { $("clock").textContent = new Date().toLocaleString("en-GB",{timeZone:"Asia/Jerusalem",weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit"}) + " · Israel"; }, 1000);
(async () => {
  [mcp, sample] = await Promise.all([claude.use("mcp"), claude.use("sample")]);
  if (!mcp){ $("headline").textContent = "Sensors offline in this view, sir."; return; }
  log("Online."); await scan();
  setInterval(tickPrices, 15000);
  setInterval(() => { if (!document.hidden) scan(); }, 300000);
})();
}
</script>
