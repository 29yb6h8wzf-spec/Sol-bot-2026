<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm suit HUD, precise and quiet until something matters
   IDEA: the helmet display from the workshop: one reactor, a few readouts, one voice line
   PICTURE: the arc-reactor ring that glows with the system state, answer underneath
   COLOUR and TYPE: night navy, reactor cyan, hot-rod red and gold; Rajdhani numerals, Heebo Hebrew
   LAYOUT: reactor + status line, ask bar with quick chips, answer, then three readouts */
:root{color-scheme:dark;--bg:#070b14;--panel:#0d1526;--line:#1c2a44;--ink:#e8f1ff;--mute:#8aa0c2;--cy:#4fd1ff;--red:#d7263d;--gold:#f5b342;--up:#3ddc84}
:root[data-theme=light]{color-scheme:light;--bg:#f3f6fb;--panel:#fff;--line:#d9e2f0;--ink:#0b1424;--mute:#5a6b86;--cy:#0a84c2;--up:#0a7d3c}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--cy) 12%,var(--bg)) 0%,var(--bg) 60%);color:var(--ink);font:16px/1.55 Heebo,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:clamp(16px,4vw,36px) max(4vw,14px) 40px}
.num{font-family:Rajdhani,system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.top{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.reactor{width:150px;height:150px}
h1{font-family:Rajdhani,sans-serif;letter-spacing:.02em;font-size:clamp(34px,8vw,48px);line-height:1;margin:0;color:var(--gold);direction:ltr;text-align:right}
#line{margin:8px 0 0;font-size:16px;color:var(--ink)}
.ask{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px}
textarea{width:100%;min-height:52px;resize:vertical;background:transparent;border:0;color:var(--ink);font:16px/1.5 Heebo,sans-serif;padding:6px 8px;outline:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:600 14px Heebo,sans-serif;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.go{margin-inline-start:auto;font:800 16px Heebo,sans-serif;min-height:44px;padding:0 22px;border-radius:999px;border:0;background:linear-gradient(90deg,var(--red),var(--gold));color:#fff;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button[disabled]{opacity:.5}
.answer{margin-top:14px;padding:16px 18px;border-inline-start:3px solid var(--cy);background:color-mix(in srgb,var(--panel) 80%,transparent);border-radius:0 14px 14px 0;white-space:pre-wrap;min-height:56px}
.answer.empty{color:var(--mute)}
.spk{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--cy);background:transparent;color:var(--cy);font:600 14px Heebo,sans-serif;cursor:pointer;display:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:14px;color:var(--mute);margin:0 0 6px;font-weight:600}
.big{font-size:28px;line-height:1.05}
.sub{font-size:14px;color:var(--mute)}
.up{color:var(--up)}.down{color:var(--red)}.warn{color:var(--gold)}
.note{font-size:13px;color:var(--mute);margin-top:16px}
.err{color:var(--red);font-size:14px;margin-top:8px}
@media(max-width:600px){.top{grid-template-columns:96px minmax(0,1fr);gap:12px}.reactor{width:96px;height:96px}.grid{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.spin{transform-origin:50% 50%;animation:s 14s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.think .core{animation:g 1s ease-in-out infinite}@keyframes g{50%{opacity:.4}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <svg class="reactor" id="reactor" viewBox="0 0 200 200" aria-hidden="true">
      <defs><radialGradient id="glow"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="var(--cy)"/><stop offset="1" stop-color="var(--cy)" stop-opacity="0"/></radialGradient></defs>
      <circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)" stroke-width="6"/>
      <g class="spin"><circle cx="100" cy="100" r="78" fill="none" stroke="var(--cy)" stroke-width="3" stroke-dasharray="18 10" opacity=".8"/></g>
      <g id="ring"></g>
      <circle class="core" cx="100" cy="100" r="34" fill="url(#glow)"/>
      <circle cx="100" cy="100" r="20" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>
    </svg>
    <div>
      <h1>J.A.R.V.I.S</h1>
      <p id="line">מאתחל מערכות…</p>
    </div>
  </div>

  <div class="ask">
    <textarea id="q" placeholder="דבר אליי, טוני. (מיקרופון במקלדת להכתבה)"></textarea>
    <div class="row">
      <button class="chip" data-q="מה מצב הבוט ב-FTMO?">הבוט</button>
      <button class="chip" data-q="מה קורה בשוק הקריפטו עכשיו?">השוק</button>
      <button class="chip" data-q="מה מצב סולאנה? מגמה, תנודתיות וסיכון במינוף 10 ו-20">סולאנה</button>
      <button class="chip" data-q="תן לי סיכום בוקר: בוט, שוק, סולאנה, מה לשים לב היום">סיכום</button>
      <button class="go" id="go" type="button">שלח</button>
    </div>
  </div>
  <div class="answer empty" id="ans" aria-live="polite">שאל אותי משהו, או לחץ על אחד הכפתורים.</div>
  <div class="row" style="margin-top:8px"><button class="spk" id="spk" type="button">🔊 הקרא</button><span class="err" id="err"></span></div>

  <div class="grid">
    <div class="card"><h2>בוט FTMO · US100</h2><div class="big" id="botS">—</div><div class="sub" id="botD">—</div></div>
    <div class="card"><h2>שוק קריפטו</h2><div class="big num" id="mkS">—</div><div class="sub" id="mkD">—</div></div>
    <div class="card"><h2>סולאנה · מגמה</h2><div class="big" id="solS">—</div><div class="sub" id="solD">—</div></div>
  </div>
  <p class="note">נתונים: שרת הבוט דרך AWS, מחירים מ-CoinGecko. ג'רוויס מציג נתונים ותרחישים, לא ייעוץ השקעות — כל החלטה ולחיצה היא שלך.</p>
</div>

<script>
{
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v,d=0) => Number(v).toLocaleString("en-US",{maximumFractionDigits:d});
const pct = v => (v>0?"+":"") + Number(v).toFixed(1) + "%";
const BOT_PY = String.raw`ps = r'''
$ErrorActionPreference="SilentlyContinue"
$ft="C:\Users\FTMODemo\FTMO"
$p = Get-CimInstance Win32_Process -Filter "Name='terminal64.exe'" | ?{ $_.CommandLine -like '*\FTMO\terminal64.exe*ftmo-trading.ini*' }
"RUN|" + [bool]$p
$f = Get-ChildItem "$ft\MQL5\Logs\2*.log" | sort Name | select -Last 3
$f | %{ Get-Content $_.FullName } | ?{ $_ -match 'US100TripleEA' -and $_ -match '\] (BUY|SELL)|closed:|CHK (DIP|TOM)|ready|failed|skipped' } | select -Last 14 | %{ ($_ -split [char]9)[2] + " " + ($_ -split [char]9)[4] }
Get-ChildItem "$ft\logs\2*.log" | sort Name | select -Last 3 | %{ Get-Content $_.FullName } | ?{ $_ -match 'deal #\d+ (buy|sell) [\d.]+ US100\.cash at' } | select -Last 6 | %{ "DEAL " + ($_ -split [char]9)[2] + " " + ($_ -split [char]9)[4] }
'''
cmd = await call_boto3(service_name="ssm", operation_name="SendCommand", region_name="il-central-1",
    params={"InstanceIds": ["i-0386e781ed9957a89"], "DocumentName": "AWS-RunPowerShellScript",
            "Comment": "read-only: jarvis bot status", "Parameters": {"commands": [ps]}, "TimeoutSeconds": 60})
cid = cmd["Command"]["CommandId"]
res = None
for _ in range(25):
    await asyncio.sleep(2)
    try:
        res = await call_boto3(service_name="ssm", operation_name="GetCommandInvocation", region_name="il-central-1",
                               params={"CommandId": cid, "InstanceId": "i-0386e781ed9957a89"})
        if res["Status"] not in ("Pending", "InProgress", "Delayed"):
            break
    except ClientError:
        pass
result = {"out": (res or {}).get("StandardOutputContent", "")}
result`;

let mcp = null, sample = null, tts = null;
const cache = {};
function dig(o, test){
  if (o == null) return null;
  if (typeof o === "string"){ try { return dig(JSON.parse(o), test); } catch(e){ return test(o) ? o : null; } }
  if (test(o)) return o;
  if (typeof o === "object") for (const k of Object.keys(o)){ const r = dig(o[k], test); if (r != null) return r; }
  return null;
}
async function call(server, tool, input){ const r = await mcp.callTool(server, tool, input); return r && r.payload !== undefined ? r.payload : r; }

async function getBot(){
  const p = await call("AWS MCP", "aws___run_script", {code: BOT_PY});
  const out = dig(p, x => typeof x === "string" && x.includes("RUN|")) || "";
  const lines = out.split(/\r?\n/).filter(Boolean);
  const run = /RUN\|True/i.test(out);
  const events = lines.filter(l => !l.startsWith("RUN|"));
  let open = {}; for (const l of events){ const m = l.match(/\[(TOM|DIP|BTM)[^\]]*\] (BUY|SELL)/); if (m) open[m[1]] = m[2]; const c = l.match(/\[2026112(5|6|7)\] closed/); if (c) delete open[{"5":"TOM","6":"DIP","7":"BTM"}[c[1]]]; if (/ready:/.test(l)) open = {}; }
  const r = {running: run, open_positions: open, recent_log: events.slice(-12)};
  cache.bot = r; return r;
}
async function getMarket(){
  const g = await call("CoinGecko", "get-global-market", {});
  const o = dig(g, x => x && typeof x === "object" && "totalMarketCapUsd" in x) || {};
  const coins = (o.coins || []).map(c => ({symbol:c.symbol, price:c.currentPrice, ch24:c.priceChangePercentage24h}));
  const r = {total_cap_usd:o.totalMarketCapUsd, cap_change_24h_pct:o.marketCapChangePercentage24hUsd, btc_dominance_pct:o.btcDominancePct, coins};
  cache.market = r; return r;
}
async function getSol(){
  const ch = await call("CoinGecko", "get-coin-market-chart", {id:"solana", days:"90"});
  const o = dig(ch, x => x && typeof x === "object" && Array.isArray(x.prices)) || {};
  const pr = (o.prices || []).map(v => Array.isArray(v) ? v[1] : v).filter(v => typeof v === "number");
  if (pr.length < 30) throw {message:"no SOL data"};
  const span = o.startTs && o.endTs ? (o.endTs - o.startTs)/864e5 : 90, per = (pr.length-1)/span;
  const avg = d => { const n = Math.max(2, Math.round(d*per)); const s = pr.slice(-n); return s.reduce((a,b)=>a+b,0)/s.length; };
  const rets = []; const step = Math.max(1, Math.round(per));
  for (let i = pr.length-1; i-step >= 0 && rets.length < 14; i -= step) rets.push(Math.abs(pr[i]/pr[i-step]-1));
  const dmove = rets.reduce((a,b)=>a+b,0)/rets.length*100;
  const r = {price: pr[pr.length-1], sma10: avg(10), sma50: avg(50), regime: avg(10) > avg(50) ? "UP" : "OFF", avg_daily_move_pct: dmove,
             liquidation_move_pct: {"10x": 10, "20x": 5}, note:"sma from ~0.75-day CoinGecko points, approximate"};
  cache.sol = r; return r;
}

function setRing(state){
  const col = state === "bad" ? "var(--red)" : state === "warn" ? "var(--gold)" : "var(--cy)";
  let s = ""; for (let i = 0; i < 10; i++){ const a = i*36*Math.PI/180; const x1 = 100+60*Math.cos(a), y1 = 100+60*Math.sin(a), x2 = 100+70*Math.cos(a), y2 = 100+70*Math.sin(a);
    s += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+col+'" stroke-width="7" stroke-linecap="round"/>'; }
  $("ring").innerHTML = s;
}
function renderCards(){
  const b = cache.bot, m = cache.market, s = cache.sol; const parts = [];
  if (b){ $("botS").textContent = b.running ? "רץ" : "לא רץ"; $("botS").className = "big " + (b.running ? "up" : "down");
    const op = Object.keys(b.open_positions); $("botD").textContent = op.length ? "פתוח: " + op.join(", ") : "אין פוזיציות פתוחות";
    parts.push(b.running ? "הבוט רץ" : "הבוט לא רץ"); }
  if (m){ const btc = m.coins.find(c => c.symbol === "btc"); $("mkS").textContent = btc ? "BTC $" + fmt(btc.price) : "—";
    $("mkD").textContent = "שוק " + pct(m.cap_change_24h_pct) + " ב-24ש · דומיננטיות " + Number(m.btc_dominance_pct).toFixed(1) + "%";
    $("mkS").className = "big num " + (m.cap_change_24h_pct < 0 ? "down" : "up"); if (btc) parts.push("BTC $" + fmt(btc.price)); }
  if (s){ $("solS").textContent = s.regime === "UP" ? "מגמת עלייה" : "מגמה כבויה"; $("solS").className = "big " + (s.regime === "UP" ? "up" : "warn");
    $("solD").textContent = "$" + fmt(s.price,2) + " · ממוצע 10: " + fmt(s.sma10,1) + " · 50: " + fmt(s.sma50,1) + " · תנועה יומית ~" + s.avg_daily_move_pct.toFixed(1) + "%";
    parts.push("SOL " + (s.regime === "UP" ? "במגמה" : "בלי מגמה")); }
  if (parts.length) $("line").textContent = parts.join(" · ");
  setRing(b && !b.running ? "bad" : s && s.regime !== "UP" ? "warn" : "ok");
}
async function refresh(){
  const jobs = [getBot().catch(e => ({e:"bot",x:e})), getMarket().catch(e => ({e:"mkt",x:e})), getSol().catch(e => ({e:"sol",x:e}))];
  const res = await Promise.all(jobs); renderCards();
  const bad = res.filter(r => r && r.e);
  if (bad.some(r => /reauth|auth/i.test(String(r.x && (r.x.code || r.x.message))))) $("err").textContent = "צריך להתחבר מחדש ל-AWS MCP בהגדרות › Connectors.";
}

const SYSTEM = "אתה JARVIS, העוזר האישי של המשתמש להשקעות ומסחר. ענה בעברית, קצר וחד (טלפון), בטון של ג'רוויס: מנומס, יבש, מדויק. המשפט הראשון מאתגר הנחה או מצביע על מה שחסר. תייג טענות [Certain]/[Likely]/[Guessing]. אל תכתוב 'שאלה מצוינת', 'אתה צודק לגמרי', 'בהחלט'. לעולם אל תמליץ לקנות או למכור: הצג נתונים, תרחישים, נקודת פסילה וגודל פוזיציה לפי סיכון של עד 1%, והזכר שההחלטה שלו. השתמש בכלים לקבלת נתונים אמיתיים ואל תמציא מספרים. הקשר: הוא מריץ בוט US100TripleEA בחשבון דמו FTMO (תחילת חודש 1x, קניית ירידות RSI2 2x, מגמה תוך-יומית 2x, תקרה 5x, עצירה יומית 4%, כוללת 8%). בסולאנה האיתות היחיד שעבר בדיקה הוא מגמה: ממוצע 10 ימים מעל 50, קנייה בלבד; הוא לא ניצח החזקה פשוטה, רק הקטין ירידות. מחקר: תבניות נרות לבדן לא הראו ערך אחרי עלויות.";
const TOOLS = [
  {name:"get_bot_status", description:"FTMO demo bot: running?, open positions, recent log lines (trades, checks).", execute: async () => cache.bot || getBot()},
  {name:"get_crypto_market", description:"Global crypto market snapshot and BTC/ETH/SOL/BNB/XRP prices with 24h change.", execute: async () => cache.market || getMarket()},
  {name:"get_sol_trend", description:"Solana price, approximate 10/50-day averages, trend regime, average daily move, liquidation distance at 10x/20x.", execute: async () => cache.sol || getSol()}
];
let ctrl = null, lastAnswer = "";
async function ask(text){
  if (!text.trim()) return;
  if (!sample){ $("ans").textContent = "שירות התשובות לא זמין בתצוגה הזו. פתח את הדף בתוך Claude."; return; }
  if (ctrl) ctrl.abort(); ctrl = new AbortController();
  $("go").disabled = true; $("reactor").classList.add("think"); $("ans").classList.remove("empty"); $("ans").textContent = "מעבד…";
  try {
    const r = await sample([{role:"user", content: SYSTEM + "\n\nשאלה: " + text}], {tools: TOOLS, signal: ctrl.signal, cache:false, onText: ({text}) => { $("ans").textContent = text; }});
    lastAnswer = r.text || ""; $("ans").textContent = lastAnswer; renderCards();
    if (tts) $("spk").style.display = "inline-block";
  } catch(e){
    $("ans").textContent = e && e.code === "rate_limited" ? "עומס רגעי. נסה שוב בעוד דקה." : e && e.code === "not_granted" ? "לא אושרה גישה לשירות התשובות." : "משהו נכשל: " + (e && (e.message || e.code) || "");
  } finally { $("go").disabled = false; $("reactor").classList.remove("think"); }
}
$("go").addEventListener("click", () => ask($("q").value));
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask($("q").value); } });
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { $("q").value = b.dataset.q; ask(b.dataset.q); }));
$("spk").addEventListener("click", () => { if (tts && lastAnswer) tts.speak(lastAnswer.slice(0,1990), {voice:"glassy"}).catch(()=>{}); });

setRing("ok");
(async () => {
  [mcp, sample, tts] = await Promise.all([claude.use("mcp"), claude.use("sample"), claude.use("tts")]);
  if (!mcp){ $("line").textContent = "אין חיבור לכלים בתצוגה הזו."; return; }
  $("line").textContent = "סורק מערכות…";
  await refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 120000);
})();
}
</script>
</body>
</html>
