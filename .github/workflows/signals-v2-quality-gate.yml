name: Signals V2 OHLCV funding quality gate
on:
  push:
    branches: [research/signals-v2-core-20261110]
    paths:
      - 'signals_v2/quality_gate.py'
      - '.github/workflows/signals-v2-quality-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve 24 months of verified source archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research_data/monthly
          gh run download 42788507430 --repo "${{ github.repository }}" --pattern 'signals-v2-20*' --dir research_data/shards
          find research_data/shards -type f -name '*.zip' -exec cp -n '{}' research_data/monthly/ ';'
          test "$(find research_data/monthly -maxdepth 1 -name '*.zip' | wc -l)" -eq 144
      - name: Check every five-minute candle against one-minute OHLCV and inspect funding
        run: python signals_v2/quality_gate.py research_data/monthly
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-v2-quality-gate-report
          path: research_data/monthly/quality_gate_report.json
          if-no-files-found: warn
          retention-days: 30
