name: Signals V2 funding schema audit
on:
  push:
    branches: [research/signals-v2-core-20261110]
    paths:
      - 'signals_v2/audit_funding_schema.py'
      - '.github/workflows/signals-v2-funding-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official funding archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research_data/monthly
          gh run download 42788507430 --repo "${{ github.repository }}" --pattern 'signals-v2-20*' --dir research_data/shards
          find research_data/shards -type f -name '*fundingRate*.zip' -exec cp -n '{}' research_data/monthly/ ';'
          test "$(find research_data/monthly -maxdepth 1 -name '*fundingRate*.zip' | wc -l)" -eq 48
      - name: Validate funding timestamp interval and rate fields
        run: python signals_v2/audit_funding_schema.py research_data/monthly
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-v2-funding-schema-report
          path: research_data/monthly/funding_schema_report.json
          if-no-files-found: warn
