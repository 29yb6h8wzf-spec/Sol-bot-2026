name: Binance Live Safety Tests
on:
  pull_request:
    paths:
      - 'futures_engine/live.py'
      - 'tests/test_live_execution_safety.py'
      - '.github/workflows/binance-live-safety.yml'
  push:
    branches: [main]
    paths:
      - 'futures_engine/live.py'
      - 'tests/test_live_execution_safety.py'
      - '.github/workflows/binance-live-safety.yml'
jobs:
  offline-live-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_live_execution_safety.py
