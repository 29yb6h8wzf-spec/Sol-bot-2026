name: SignalPilot Pro Risk Tests
on:
  pull_request:
    paths:
      - 'cloudflare/risk-engine.mjs'
      - 'cloudflare/risk-engine.test.mjs'
      - '.github/workflows/signalpilot-pro-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloudflare/risk-engine.test.mjs
