name: SOL Telegram Alerts

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a Telegram test message (no trade signal)'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [SOLUSDT, BTCUSDT, ETHUSDT]
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Telegram test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test && matrix.symbol == 'SOLUSDT' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SYMBOL: ${{ matrix.symbol }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --test
      - name: Scan SOLUSDT
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.send_test) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SYMBOL: ${{ matrix.symbol }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
