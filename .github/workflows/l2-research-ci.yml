name: L2 Research CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Compile L2 helpers
        run: python -m py_compile research/l2_validation.py tests/test_l2_validation.py
      - name: Lint L2 helpers
        run: ruff check research/l2_validation.py tests/test_l2_validation.py
      - name: Offline unit tests
        run: python -m pytest -q tests/test_l2_validation.py
