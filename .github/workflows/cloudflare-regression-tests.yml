name: Cloudflare Scanner Regression Tests
on:
  pull_request:
    paths:
      - 'cloudflare/worker.js'
      - 'cloudflare/worker.test.mjs'
      - 'cloudflare/deploy-worker.mjs'
      - '.github/workflows/cloudflare-regression-tests.yml'
  workflow_dispatch:
jobs:
  scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check cloudflare/worker.js
      - run: node --check cloudflare/deploy-worker.mjs
      - run: node --test cloudflare/worker.test.mjs cloudflare/sl-tp-report.test.mjs
