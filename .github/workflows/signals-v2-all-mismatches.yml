name: Signals V2 full OHLCV mismatch enumeration
on:
  push:
    branches: [research/signals-v2-core-20261110]
    paths:
      - 'signals_v2/enumerate_all_mismatches.py'
      - '.github/workflows/signals-v2-all-mismatches.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve historical archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research_data/monthly
          gh run download 42788507430 --repo "${{ github.repository }}" --pattern 'signals-v2-20*' --dir research_data/shards
          find research_data/shards -type f -name '*.zip' -exec cp -n '{}' research_data/monthly/ ';'
      - name: Enumerate every 1m 5m discrepancy
        run: python signals_v2/enumerate_all_mismatches.py research_data/monthly
      - name: Upload exhaustive mismatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-v2-all-ohlcv-mismatches
          path: research_data/monthly/all_ohlcv_mismatches.json
          if-no-files-found: warn
