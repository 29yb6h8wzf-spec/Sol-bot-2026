name: SOL Daily Status

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

jobs:
  daily-status:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [SOLUSDT, BTCUSDT, ETHUSDT]
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Binance and send Telegram status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SYMBOL: ${{ matrix.symbol }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --status
