name: SOL Daily Status

# Owner's daily scheduled heartbeat is sent by the Cloudflare Worker after a real cron scan.
# Retain manual-only legacy diagnostics to avoid four duplicate daily Telegram messages.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-status:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symbol: [SOLUSDT, BTCUSDT, ETHUSDT, XRPUSDT]
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Kraken Spot manually and send one Telegram status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SYMBOL: ${{ matrix.symbol }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --status
