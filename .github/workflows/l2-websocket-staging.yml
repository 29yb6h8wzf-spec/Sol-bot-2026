name: L2 Public WebSocket Staging 720s
on:
  pull_request:
    paths:
      - 'research/public_websocket_staging.py'
      - '.github/workflows/l2-websocket-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  websocket-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public WebSocket client
        run: python -m pip install 'websockets>=13,<16'
      - name: Read-only six-stream WebSocket staging
        run: python research/public_websocket_staging.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-public-websocket-720s
          path: staging-results/public-websocket-720s.json
          if-no-files-found: warn
