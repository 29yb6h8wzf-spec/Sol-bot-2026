name: Deploy and Verify Cloudflare Scanner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-worker.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-production-scanner
  cancel-in-progress: false
jobs:
  validate-worker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Cloudflare Futures scanner without deployment
        run: node --test cloudflare/worker.test.mjs
      - name: Check Cloudflare deployment verifier syntax
        run: node --check cloudflare/deploy-worker.mjs
  deploy-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test market-data parsing and scan accounting
        run: node --test cloudflare/worker.test.mjs
      - name: Validate deployment verifier syntax
        run: node --check cloudflare/deploy-worker.mjs
      - name: Deploy without changing bindings and verify actual cron runs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node cloudflare/deploy-worker.mjs
