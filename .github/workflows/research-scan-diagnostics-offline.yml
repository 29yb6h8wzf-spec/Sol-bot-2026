name: Research scan diagnostics offline artifact

on:
  pull_request:
    paths:
      - 'futures_engine/research_scan_diagnostics_*.py'
      - 'tests/test_research_scan_diagnostics_*.py'
      - '.github/workflows/research-scan-diagnostics-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate synthetic SQLite fixture and run offline report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-artifacts
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path
          path = Path('diagnostic-artifacts/synthetic-scans.sqlite3')
          with sqlite3.connect(path) as db:
              db.execute('CREATE TABLE research_scans (id INTEGER PRIMARY KEY, payload TEXT)')
              for symbol, score in [('SOL/USDT:USDT', 82), ('XRP/USDT:USDT', None)]:
                  diag = {'setups_seen': 1, 'below_threshold': int(score is not None),
                          'invalid_score': int(score is None),
                          'verification_rejected': 0, 'eligible': 0, 'no_setup': False}
                  db.execute('INSERT INTO research_scans(payload) VALUES (?)',
                             (json.dumps({'symbol': symbol, 'status': 'RESEARCH_ONLY',
                                          'scan_diagnostics': diag}),))
          PY
          PYTHONPATH=. python -m futures_engine.research_scan_diagnostics_cli \
            --db diagnostic-artifacts/synthetic-scans.sqlite3 \
            > diagnostic-artifacts/synthetic-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('diagnostic-artifacts/synthetic-report.json').read_text())
          assert report['totals']['scans'] == 2
          assert report['totals']['below_threshold'] == 1
          assert report['totals']['invalid_score'] == 1
          assert report['execution_authorized'] is False
          PY
          rm diagnostic-artifacts/synthetic-scans.sqlite3
      - name: Upload synthetic diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: signalpilot-synthetic-scan-diagnostics
          path: diagnostic-artifacts/synthetic-report.json
          if-no-files-found: error
          retention-days: 7
