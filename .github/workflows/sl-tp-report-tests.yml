name: SL TP Telegram Report Tests
on:
  pull_request:
    paths:
      - 'cloudflare/worker.js'
      - 'cloudflare/sl-tp-report.test.mjs'
      - '.github/workflows/sl-tp-report-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloudflare/worker.js
      - run: node --test cloudflare/sl-tp-report.test.mjs
