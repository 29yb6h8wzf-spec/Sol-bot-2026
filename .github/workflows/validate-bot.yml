name: Validate Crypto Bot
on:
  workflow_dispatch:
  push:
    paths:
      - 'bot.py'
      - 'tests/**'
      - 'strategies.py'
      - 'news.py'
      - '.github/workflows/validate-bot.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax check
        run: python -m py_compile bot.py strategies.py news.py
      - name: Futures-only market source regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Indicator smoke test without live data
        run: |
          python - <<'PY'
          from strategies import candidates
          bars = [{'time':i*300000,'high':100+i*.02+1,'low':100+i*.02-1,
                   'close':100+i*.02,'volume':1000} for i in range(120)]
          four = [{'time':i*14400000,'high':100+i*.03+2,'low':100+i*.03-2,
                   'close':100+i*.03,'volume':1000} for i in range(100)]
          signals, stats = candidates(bars,four)
          assert isinstance(signals,list)
          assert stats['atr'] > 0
          print('Indicators OK',stats)
          from bot import missed_closed_candles, scan_log
          from datetime import datetime, timezone
          now = int(datetime.now(timezone.utc).timestamp() * 1000)
          closed = [{'time': now - i * 300000 - 600000} for i in range(4, 0, -1)]
          assert len(missed_closed_candles(closed)) == 3
          scan_log('validation_smoke_test', candidate_count=0)
          PY
