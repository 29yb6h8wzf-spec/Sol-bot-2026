name: Telegram Access Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker.js'
      - 'cloudflare/check-telegram-access.mjs'
      - '.github/workflows/telegram-access-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Telegram webhook and private Cloudflare KV polling state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/check-telegram-access.mjs
