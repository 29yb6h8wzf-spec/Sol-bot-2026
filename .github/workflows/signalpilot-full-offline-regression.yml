name: SignalPilot Full Offline Regression
on:
  push:
    paths:
      - '**/*.py'
      - 'futures-requirements.txt'
      - '.github/workflows/signalpilot-full-offline-regression.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'futures-requirements.txt'
      - '.github/workflows/signalpilot-full-offline-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      TRADING_MODE: paper
      SIGNALPILOT_LIVE_ARMED: "NO"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r futures-requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run all Python tests together (no exchange credentials)
        run: python -m pytest -q tests/
